
name: blooddonation-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: exam_2400032187
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400032187"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - blooddonation-network

  backend:
    image: juneliasamaddar/docker-backend-2400032187:latest
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    container_name: blooddonation-backend
    ports:
      - "8081:8081"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blooddonation-network

volumes:
  postgres_data:

networks:
  blooddonation-network:
    driver: bridge
