
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: exam_2400032187
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blooddonation-net

  backend:
    image: juneliasamaddar/docker-backend-2400032187:latest
    container_name: blooddonation-backend
    ports:
      - "8081:8081"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - blooddonation-net

  frontend:
    image: juneliasamaddar/docker-frontend-2400032187:latest
    container_name: blooddonation-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - blooddonation-net

volumes:
  postgres_data:

networks:
  blooddonation-net:
